<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧟 Slice of the Dead</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #111; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); color: white; text-align: center;
        }
        .hidden { display: none !important; }
        h1 { font-size: 3rem; color: #ff4d4d; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }
        p { font-size: 1.2rem; margin-bottom: 20px; color: #ccc; }
        .btn {
            pointer-events: auto; background: #2a4730; border: 3px solid #7fa86b;
            color: #e9f5d9; font-size: 1.5rem; font-weight: bold; padding: 15px 40px;
            border-radius: 50px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 6px 0 #0e1a0f; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0e1a0f; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1>SLICE OF THE DEAD</h1>
        <p>WASD / Arrows to Move<br>Click / Swipe to Slash</p>
        <button id="startBtn" class="btn">START SURVIVING</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>YOU DIED</h1>
        <p>Zombies Killed: <span id="finalScore">0</span></p>
        <button id="retryBtn" class="btn">TRY AGAIN</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');

    // Resize
    let width, height;
    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let gameActive = false;
    let score = 0;
    
    // The Player
    const player = {
        x: width / 2, y: height / 2,
        radius: 16,
        speed: 4.5,
        hp: 100,
        attackCooldown: 0,
        attackRadius: 75,
        facing: { x: 0, y: 1 } // looking down by default
    };

    // Arrays
    let zombies = [];
    let particles = [];
    let bloodSplatters = []; // stays on the ground
    let trail = []; // Slice trail

    // Inputs
    const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };
    let mouse = { x: 0, y: 0, isDown: false };

    // Touch / Joystick
    let touchStart = null;
    let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };

    // Config
    const ZOMBIE_SPEED = 1.2;
    const SPAWN_RATE = 90; // frames
    let spawnTimer = 0;

    // --- CORE FUNCTIONS ---

    function resetGame() {
        gameActive = true;
        score = 0;
        player.x = width / 2;
        player.y = height / 2;
        player.hp = 100;
        player.attackCooldown = 0;
        zombies = [];
        particles = [];
        bloodSplatters = [];
        trail = [];
        spawnTimer = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
    }

    function gameOver() {
        gameActive = false;
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    // --- ZOMBIES ---

    function spawnZombie() {
        // Spawn on a random edge
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? -30 : width + 30;
            y = Math.random() * height;
        } else {
            x = Math.random() * width;
            y = Math.random() < 0.5 ? -30 : height + 30;
        }

        zombies.push({
            x, y,
            radius: 14 + Math.random() * 6,
            speed: ZOMBIE_SPEED + Math.random() * 0.5,
            hue: 80 + Math.random() * 40,
            angle: 0,
            hitFlash: 0
        });
    }

    function killZombie(index) {
        const z = zombies[index];
        score++;
        
        // Add blood splatter to the ground
        bloodSplatters.push({
            x: z.x, y: z.y,
            radius: z.radius * (1.2 + Math.random()),
            alpha: 0.8,
            hue: z.hue
        });

        // Add flying particles
        for (let i = 0; i < 15; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 2 + Math.random() * 6;
            particles.push({
                x: z.x, y: z.y,
                vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                radius: 2 + Math.random() * 4,
                life: 1.0,
                color: `hsl(${z.hue}, 70%, 40%)`
            });
        }
        zombies.splice(index, 1);
    }

    // --- ATTACK ---

    function attack() {
        if (player.attackCooldown > 0 || !gameActive) return;
        player.attackCooldown = 20; // ~0.3 seconds at 60fps

        // Calculate attack area (a cone in front of player based on mouse/touch)
        let attackAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        let attackArc = Math.PI / 1.5; // 120 degree swing
        let hitSomething = false;

        // Check collisions with zombies
        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            const dist = Math.hypot(z.x - player.x, z.y - player.y);
            
            if (dist < player.attackRadius + z.radius) {
                // Check angle
                let angleToZ = Math.atan2(z.y - player.y, z.x - player.x);
                let angleDiff = Math.abs(attackAngle - angleToZ);
                // Normalize angle difference
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < attackArc / 2) {
                    killZombie(i);
                    hitSomething = true;
                }
            }
        }

        // Add visual slash effect to particles
        for(let i=0; i<10; i++) {
            let spread = (Math.random() - 0.5) * attackArc;
            let dist = player.attackRadius * (0.5 + Math.random() * 0.5);
            particles.push({
                x: player.x + Math.cos(attackAngle + spread) * dist,
                y: player.y + Math.sin(attackAngle + spread) * dist,
                vx: Math.cos(attackAngle) * 2,
                vy: Math.sin(attackAngle) * 2,
                radius: 3, life: 0.5,
                color: '#fff'
            });
        }
    }

    // --- UPDATE LOOP ---

    function update() {
        if (!gameActive) return;

        // 1. Player Movement (Keyboard)
        let moveX = 0, moveY = 0;
        if (keys.w || keys.up) moveY -= 1;
        if (keys.s || keys.down) moveY += 1;
        if (keys.a || keys.left) moveX -= 1;
        if (keys.d || keys.right) moveX += 1;

        // Player Movement (Joystick)
        if (joystick.active) {
            moveX += joystick.dx;
            moveY += joystick.dy;
        }

        // Normalize diagonal movement
        const len = Math.hypot(moveX, moveY);
        if (len > 0) {
            moveX /= len;
            moveY /= len;
            player.x += moveX * player.speed;
            player.y += moveY * player.speed;
        }

        // Keep player in bounds
        player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

        // Update facing direction based on mouse
        if (!joystick.active) {
            player.facing.x = mouse.x - player.x;
            player.facing.y = mouse.y - player.y;
        } else {
            player.facing.x = joystick.dx;
            player.facing.y = joystick.dy;
        }

        // 2. Attack Cooldowns
        if (player.attackCooldown > 0) player.attackCooldown--;
        if (mouse.isDown) attack(); // Hold to auto-swing

        // 3. Spawning
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnZombie();
            // Spawn faster as score goes up
            spawnTimer = Math.max(20, SPAWN_RATE - Math.floor(score / 5) * 5);
        }

        // 4. Zombie Logic
        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            
            // Move towards player
            const dx = player.x - z.x;
            const dy = player.y - z.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0) {
                z.x += (dx / dist) * z.speed;
                z.y += (dy / dist) * z.speed;
                z.angle = Math.atan2(dy, dx);
            }

            if (z.hitFlash > 0) z.hitFlash--;

            // Hit player
            if (dist < player.radius + z.radius) {
                player.hp -= 0.5; // Damage per frame while touching
                z.x -= (dx / dist) * 2; // Push zombie back slightly
                z.y -= (dy / dist) * 2;
                
                if (player.hp <= 0) {
                    player.hp = 0;
                    gameOver();
                    return;
                }
            }
        }

        // 5. Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.9; p.vy *= 0.9;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // 6. Fade Blood Splatters
        for (let i = bloodSplatters.length - 1; i >= 0; i--) {
            bloodSplatters[i].alpha -= 0.002;
            if (bloodSplatters[i].alpha <= 0) bloodSplatters.splice(i, 1);
        }
    }

    // --- DRAWING ---

    function draw() {
        // Clear background
        ctx.fillStyle = '#1e221c';
        ctx.fillRect(0, 0, width, height);

        // Draw grid floor
        ctx.strokeStyle = '#2a3326';
        ctx.lineWidth = 1;
        for (let i = 0; i < width; i += 60) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
        }
        for (let i = 0; i < height; i += 60) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
        }

        // Draw Blood Splatters (on ground)
        bloodSplatters.forEach(b => {
            ctx.fillStyle = `hsla(${b.hue}, 70%, 30%, ${b.alpha})`;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Zombies
        zombies.forEach(z => {
            ctx.save();
            ctx.translate(z.x, z.y);
            ctx.rotate(z.angle);
            
            // Zombie Body
            ctx.fillStyle = `hsl(${z.hue}, 60%, 40%)`;
            ctx.beginPath(); ctx.arc(0, 0, z.radius, 0, Math.PI * 2); ctx.fill();
            
            // Zombie Eyes (Red glowing)
            ctx.fillStyle = '#ff3333';
            ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(z.radius*0.4, -z.radius*0.3, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(z.radius*0.4, z.radius*0.3, 2.5, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();
        });

        // Draw Player
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Player direction indicator (where they are looking)
        ctx.rotate(Math.atan2(player.facing.y, player.facing.x));
        
        // Body
        ctx.fillStyle = '#4a90e2';
        ctx.shadowColor = '#4a90e2'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
        
        // Weapon (Cleaver)
        ctx.fillStyle = '#ccc';
        ctx.fillRect(player.radius - 5, -4, 20, 8);
        
        ctx.restore();

        // Draw Attack Slash Effect
        if (player.attackCooldown > 10) {
            ctx.save();
            ctx.translate(player.x, player.y);
            let atkAngle = Math.atan2(player.facing.y, player.facing.x);
            ctx.rotate(atkAngle);
            
            ctx.beginPath();
            ctx.arc(0, 0, player.attackRadius, -Math.PI/3, Math.PI/3);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            ctx.restore();
        }

        // Draw Touch Joystick
        if (joystick.active) {
            ctx.beginPath();
            ctx.arc(joystick.originX, joystick.originY, 40, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(joystick.originX + joystick.dx * 40, joystick.originY + joystick.dy * 40, 20, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();
        }

        // --- HUD ---
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(`KILLS: ${score}`, 20, 40);

        // Health Bar
        ctx.fillStyle = '#333';
        ctx.fillRect(20, 60, 200, 20);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(20, 60, Math.max(0, (player.hp / 100) * 200), 20);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 60, 200, 20);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- INPUT HANDLING ---

    // Keyboard
    window.addEventListener('keydown', e => {
        if (e.key === 'w' || e.key === 'ArrowUp') keys.w = keys.up = true;
        if (e.key === 's' || e.key === 'ArrowDown') keys.s = keys.down = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = keys.right = true;
        if (e.key === ' ') attack();
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'w' || e.key === 'ArrowUp') keys.w = keys.up = false;
        if (e.key === 's' || e.key === 'ArrowDown') keys.s = keys.down = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = keys.right = false;
    });

    // Mouse
    canvas.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    canvas.addEventListener('mousedown', e => {
        mouse.isDown = true;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        attack();
    });
    window.addEventListener('mouseup', () => mouse.isDown = false);

    // Touch (Joystick + Swipe)
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        
        // If touching left side of screen, start joystick
        if (t.clientX < width / 2 && !joystick.active) {
            joystick.active = true;
            joystick.originX = t.clientX;
            joystick.originY = t.clientY;
            joystick.dx = 0; joystick.dy = 0;
        } else {
            // Right side: Attack
            mouse.x = t.clientX;
            mouse.y = t.clientY;
            attack();
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        if (joystick.active) {
            let dx = t.clientX - joystick.originX;
            let dy = t.clientY - joystick.originY;
            let dist = Math.hypot(dx, dy);
            if (dist > 50) dist = 50; // clamp joystick
            
            joystick.dx = dx / 50;
            joystick.dy = dy / 50;
        }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        joystick.active = false;
        joystick.dx = 0; joystick.dy = 0;
    }, { passive: false });

    // UI Buttons
    document.getElementById('startBtn').addEventListener('click', resetGame);
    document.getElementById('retryBtn').addEventListener('click', resetGame);

    // Start loop
    gameLoop();
</script>
</body>
</html>
