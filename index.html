<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🗡️ Ghosts 'n Zombies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #050508; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); color: white; text-align: center; z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { font-size: 3.5rem; color: #d4af37; text-shadow: 3px 3px 0 #000; margin-bottom: 10px; }
        p { font-size: 1.2rem; margin-bottom: 20px; color: #aaa; line-height: 1.5; }
        .btn {
            pointer-events: auto; background: #3b2b1a; border: 3px solid #d4af37;
            color: #fff; font-size: 1.5rem; font-weight: bold; padding: 15px 40px;
            border-radius: 5px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 6px 0 #1a120a; transition: transform 0.1s; font-family: inherit;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1a120a; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1>GHOSTS 'N ZOMBIES</h1>
        <p>A / D or Arrow Keys to Move<br>W / Up / Space to Jump<br>Click / Tap to Throw Daggers</p>
        <button id="startBtn" class="btn">ENTER THE GRAVEYARD</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>YOU DIED</h1>
        <p>Zombies Slain: <span id="finalScore">0</span></p>
        <button id="retryBtn" class="btn">TRY AGAIN</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');

    // Resize
    let width, height;
    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let gameActive = false;
    let score = 0;
    let cameraX = 0;
    let spawnTimer = 0;
    let screenShake = 0;

    // World Data
    const GRAVITY = 0.6;
    const GROUND_Y = height - 60;
    let platforms = [];
    let zombies = [];
    let projectiles = [];
    let particles = [];

    // The Player
    const player = {
        x: 100, y: GROUND_Y - 40,
        vx: 0, vy: 0,
        width: 24, height: 40,
        speed: 5.5,
        jumpPower: -13,
        isGrounded: true,
        facing: 1, // 1 = right, -1 = left
        attackCooldown: 0,
        hp: 100,
        hitFlash: 0
    };

    // Inputs
    const keys = { a: false, d: false, w: false, up: false, left: false, right: false };
    let attackInput = false;

    // --- CORE FUNCTIONS ---

    function resetGame() {
        gameActive = true;
        score = 0;
        cameraX = 0;
        player.x = 100;
        player.y = GROUND_Y - 40;
        player.vx = 0; player.vy = 0;
        player.hp = 100;
        player.hitFlash = 0;
        
        zombies = [];
        projectiles = [];
        particles = [];
        
        // Generate some floating platforms
        platforms = [
            { x: 300, y: GROUND_Y - 120, w: 150, h: 20 },
            { x: 600, y: GROUND_Y - 200, w: 200, h: 20 },
            { x: 950, y: GROUND_Y - 100, w: 150, h: 20 },
            { x: 1300, y: GROUND_Y - 180, w: 200, h: 20 },
            { x: 1700, y: GROUND_Y - 120, w: 150, h: 20 }
        ];
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
    }

    function gameOver() {
        gameActive = false;
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    // --- SPAWNING ---

    function spawnZombie() {
        // Spawn ahead of the player, just off-screen right
        let spawnX = player.x + width + 100;
        // 30% chance to spawn on a random platform
        let spawnY = GROUND_Y - 40;
        if (Math.random() < 0.3 && platforms.length > 0) {
            const p = platforms[Math.floor(Math.random() * platforms.length)];
            spawnX = p.x + p.w / 2;
            spawnY = p.y - 35;
        }

        zombies.push({
            x: spawnX, y: spawnY,
            vx: -1.5 - Math.random(), vy: 0,
            width: 26, height: 38,
            isGrounded: false,
            hp: 1,
            hitFlash: 0
        });
    }

    // --- ATTACK ---

    function throwDagger() {
        if (player.attackCooldown > 0 || !gameActive) return;
        player.attackCooldown = 15; // frames
        
        projectiles.push({
            x: player.x + (player.facing === 1 ? player.width : 0),
            y: player.y + 15,
            vx: player.facing * 12,
            width: 15, height: 4,
            life: 100
        });
    }

    // --- UPDATE LOOP ---

    function update() {
        if (!gameActive) return;

        // Screen Shake decay
        if (screenShake > 0) screenShake -= 1;

        // 1. Player Horizontal Movement
        let moveX = 0;
        if (keys.a || keys.left) moveX -= 1;
        if (keys.d || keys.right) moveX += 1;
        
        if (moveX !== 0) {
            player.vx = moveX * player.speed;
            player.facing = moveX; // Face direction of movement
        } else {
            player.vx = 0;
        }

        // 2. Jumping
        if ((keys.w || keys.up) && player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }

        // 3. Apply Gravity
        player.vy += GRAVITY;
        player.x += player.vx;
        player.y += player.vy;

        // 4. Attack Cooldown
        if (player.attackCooldown > 0) player.attackCooldown--;
        if (player.hitFlash > 0) player.hitFlash--;
        if (attackInput) throwDagger();

        // 5. Camera Follow
        let targetCamX = player.x - width / 3;
        if (targetCamX < 0) targetCamX = 0;
        cameraX += (targetCamX - cameraX) * 0.1;

        // 6. Collision (Player vs Platforms & Ground)
        player.isGrounded = false;
        
        // Ground collision
        if (player.y + player.height >= GROUND_Y) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        // Platform collision
        platforms.forEach(p => {
            if (player.vy >= 0 && // Falling
                player.x + player.width > p.x && player.x < p.x + p.w &&
                player.y + player.height > p.y && player.y + player.height < p.y + p.h + player.vy) {
                
                player.y = p.y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }
        });

        // 7. Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const pr = projectiles[i];
            pr.x += pr.vx;
            pr.life--;

            // Remove if off-screen or dead
            if (pr.life <= 0 || pr.x < cameraX - 100 || pr.x > cameraX + width + 100) {
                projectiles.splice(i, 1);
                continue;
            }

            // Hit zombie
            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                if (pr.x + pr.width > z.x && pr.x < z.x + z.width &&
                    pr.y + pr.height > z.y && pr.y < z.y + z.height) {
                    
                    // Zombie dies
                    score++;
                    screenShake = 10;
                    
                    // Blood particles
                    for (let k = 0; k < 12; k++) {
                        particles.push({
                            x: z.x + z.width/2, y: z.y + z.height/2,
                            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                            life: 1.0, color: `hsl(${80 + Math.random()*40}, 70%, 40%)`
                        });
                    }
                    
                    zombies.splice(j, 1);
                    projectiles.splice(i, 1);
                    break;
                }
            }
        }

        // 8. Update Zombies
        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            
            // Simple AI: Walk left towards player
            z.vx = (player.x < z.x) ? -1.5 : 1.5;
            z.vy += GRAVITY;
            z.x += z.vx;
            z.y += z.vy;

            // Collision with ground
            z.isGrounded = false;
            if (z.y + z.height >= GROUND_Y) {
                z.y = GROUND_Y - z.height;
                z.vy = 0;
                z.isGrounded = true;
            }

            // Collision with platforms
            platforms.forEach(p => {
                if (z.vy >= 0 &&
                    z.x + z.width > p.x && z.x < p.x + p.w &&
                    z.y + z.height > p.y && z.y + z.height < p.y + p.h + z.vy) {
                    z.y = p.y - z.height;
                    z.vy = 0;
                    z.isGrounded = true;
                }
            });

            if (z.hitFlash > 0) z.hitFlash--;

            // Hit player
            if (player.x + player.width > z.x && player.x < z.x + z.width &&
                player.y + player.height > z.y && player.y < z.y + z.height) {
                
                player.hp -= 1; // Damage
                player.hitFlash = 10;
                screenShake = 15;
                
                // Knockback player
                player.vx = (player.x < z.x) ? -8 : 8;
                player.vy = -5;
                
                // Knockback zombie
                z.x += (z.x < player.x) ? -10 : 10;

                if (player.hp <= 0) {
                    gameOver();
                    return;
                }
            }

            // Remove zombies that fall off or go too far behind
            if (z.y > height + 200 || z.x < cameraX - 300) {
                zombies.splice(i, 1);
            }
        }

        // 9. Spawning
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnZombie();
            spawnTimer = Math.max(30, 100 - Math.floor(score / 3) * 5);
        }

        // 10. Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.vy += GRAVITY * 0.5;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // --- DRAWING ---

    function draw() {
        // Screen Shake translation
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        // Clear background (Night Sky)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, '#0a0a1a');
        skyGrad.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Moon
        ctx.fillStyle = '#d4d4d4';
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 40;
        ctx.beginPath(); ctx.arc(width - 150, 100, 50, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Parallax Mountains (Background)
        ctx.fillStyle = '#141424';
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let i = 0; i < width + 200; i += 100) {
            let mx = i - (cameraX * 0.2) % 200;
            let my = height - 200 + Math.sin(i * 0.01) * 80;
            ctx.lineTo(mx, my);
        }
        ctx.lineTo(width, height);
        ctx.fill();

        // Parallax Trees (Midground)
        ctx.fillStyle = '#0d0d18';
        for (let i = -200; i < width + 200; i += 120) {
            let tx = i - (cameraX * 0.5) % 120;
            ctx.fillRect(tx, height - 350, 20, 350);
            ctx.beginPath(); ctx.arc(tx + 10, height - 350, 40, 0, Math.PI*2); ctx.fill();
        }

        // World Translation (Camera)
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Draw Platforms
        platforms.forEach(p => {
            ctx.fillStyle = '#2a2a35';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Top highlight
            ctx.fillStyle = '#3a3a4a';
            ctx.fillRect(p.x, p.y, p.w, 4);
        });

        // Draw Ground
        ctx.fillStyle = '#1a1a25';
        ctx.fillRect(cameraX, GROUND_Y, width, height - GROUND_Y);
        ctx.fillStyle = '#2a2a35';
        ctx.fillRect(cameraX, GROUND_Y, width, 5); // Grass/Top edge

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Projectiles (Daggers)
        projectiles.forEach(pr => {
            ctx.fillStyle = '#d4af37';
            ctx.shadowColor = '#d4af37'; ctx.shadowBlur = 10;
            ctx.fillRect(pr.x, pr.y, pr.width, pr.height);
            // Dagger handle
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(pr.x + (pr.vx > 0 ? -5 : pr.width), pr.y - 2, 5, 8);
            ctx.shadowBlur = 0;
        });

        // Draw Zombies
        zombies.forEach(z => {
            ctx.save();
            ctx.translate(z.x, z.y);
            
            // Walking animation (bobbing)
            let bob = Math.sin(Date.now() * 0.01) * 2;
            if (!z.isGrounded) bob = 0;

            // Zombie Body
            ctx.fillStyle = '#4a7a3a';
            ctx.fillRect(4, 10 + bob, 18, 28);
            
            // Zombie Head
            ctx.fillStyle = '#5a8a4a';
            ctx.beginPath(); ctx.arc(13, 10 + bob, 10, 0, Math.PI*2); ctx.fill();
            
            // Red Eyes
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(10, 6 + bob, 3, 3);
            ctx.fillRect(16, 6 + bob, 3, 3);

            // Arms reaching out
            ctx.fillStyle = '#4a7a3a';
            if (z.vx < 0) {
                ctx.fillRect(-6, 15 + bob, 12, 6); // Left arm
            } else {
                ctx.fillRect(20, 15 + bob, 12, 6); // Right arm
            }
            
            ctx.restore();
        });

        // Draw Player (Knight)
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Flash white if hit
        if (player.hitFlash > 0) {
            ctx.globalAlpha = Math.sin(Date.now() * 0.05) * 0.5 + 0.5;
        }

        // Body (Armor)
        ctx.fillStyle = '#5c7c9e'; // Steel blue
        ctx.fillRect(4, 15, 16, 25);
        
        // Head (Helmet)
        ctx.fillStyle = '#8ca8c4';
        ctx.fillRect(6, 0, 12, 15);
        // Visor
        ctx.fillStyle = '#111';
        ctx.fillRect(player.facing === 1 ? 12 : 6, 4, 6, 4);

        // Legs
        ctx.fillStyle = '#3b5066';
        let legOffset = player.isGrounded && player.vx !== 0 ? Math.sin(Date.now() * 0.02) * 6 : 0;
        ctx.fillRect(4, 38, 6, 2 + legOffset);
        ctx.fillRect(14, 38, 6, 2 - legOffset);

        // Sword (If attacking)
        if (player.attackCooldown > 5) {
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff'; ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(player.facing === 1 ? 20 : -10, 20);
            ctx.lineTo(player.facing === 1 ? 50 : -40, 10);
            ctx.lineTo(player.facing === 1 ? 50 : -40, 16);
            ctx.lineTo(player.facing === 1 ? 20 : -10, 26);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.restore(); // End Player drawing

        ctx.restore(); // End World Translation

        // --- HUD (Fixed to screen) ---
        // Vignette effect
        const vignette = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);

        // UI Text
        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SLAIN: ${score}`, 20, 40);
        ctx.fillText(`DISTANCE: ${Math.floor(player.x / 10)}m`, 20, 70);

        // Health Bar
        ctx.fillStyle = '#333';
        ctx.fillRect(20, 90, 200, 20);
        ctx.fillStyle = '#8b0000'; // Dark red
        ctx.fillRect(20, 90, Math.max(0, (player.hp / 100) * 200), 20);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 90, 200, 20);

        if (player.hitFlash > 0) {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);
        }

        ctx.restore(); // End Screen Shake
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- INPUT HANDLING ---

    window.addEventListener('keydown', e => {
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.w = keys.up = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = keys.right = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.w = keys.up = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = keys.right = false;
    });

    // Mouse/Touch to attack
    canvas.addEventListener('mousedown', e => {
        e.preventDefault();
        attackInput = true;
        throwDagger();
    });
    window.addEventListener('mouseup', () => attackInput = false);
    
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        attackInput = true;
        throwDagger();
    }, { passive: false });
    window.addEventListener('touchend', () => attackInput = false);

    // UI Buttons
    document.getElementById('startBtn').addEventListener('click', resetGame);
    document.getElementById('retryBtn').addEventListener('click', resetGame);

    // Start loop
    gameLoop();
</script>
</body>
</html>
